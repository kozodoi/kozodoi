# Temporary: tries Apify X scrapers against @n_kozodoi before choosing one.
# Runs only on pushes to this test branch; never merged.
name: Test X scrapers

on:
  push:
    branches: [claude/charming-ptolemy-izqynp]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Try scrapers
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/test_x_scrapers.py

      # hand the raw output back to the session drafting the feed
      - name: Commit preview output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          git commit -m "Preview: raw X scraper output and Apify usage" || exit 0
          git push
