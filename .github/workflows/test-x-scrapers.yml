# Temporary: tries Apify X scrapers against @n_kozodoi before choosing one.
# Runs only on pushes to this test branch; never merged.
name: Test X scrapers

on:
  push:
    branches: [claude/charming-ptolemy-izqynp]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Haiku verdicts on the X posts an earlier preview saved, so no
      # scraper quota is spent
      - name: Haiku verdicts on saved posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet anthropic==2.12.0
          git show c385df6:preview/data.json > "$RUNNER_TEMP/saved.json"
          cd scripts && python preview_haiku.py "$RUNNER_TEMP/saved.json"
