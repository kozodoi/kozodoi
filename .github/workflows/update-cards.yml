name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate custom cards
        env:
          # use a PAT (repo + read:user scopes) for private repos and accurate
          # private commit counts; GITHUB_TOKEN works for public-only stats
          GH_TOKEN: ${{ secrets.GH_CARDS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          ORG: "aws-samples"
          INCLUDE_EXTRA: "" # force-add repos, e.g. "aws-samples/foo aws-samples/bar"
          EXCLUDE_REPOS: "" # drop repos, e.g. "aws-samples/tiny-typo-fix"
          LANGS_HIDE: "jupyter notebook,html"
          LANGS_COUNT: "3"
          CARD_WIDTH: "400" # shared with the citations card so both align
          OUT_DIR: "profile"
        run: python scripts/generate_cards.py

      - name: Generate Google Scholar card
        env:
          SCHOLAR_ID: "58tMuD0AAAAJ"
          SCHOLAR_LANG: "en"
          # SerpApi key (repo secret) for a reliable read; scraping is the fallback
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OUT_DIR: "profile"
        run: python scripts/generate_scholar_card.py

      - name: Fetch latest LinkedIn posts
        env:
          # Apify API token (repo secret); the step keeps the last posts without it
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: "harvestapi~linkedin-profile-posts"
          LINKEDIN_PROFILE: "https://www.linkedin.com/in/kozodoi/"
          LINKEDIN_COUNT: "3"
          OUT_DIR: "profile"
        run: python scripts/fetch_linkedin_posts.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg profile/data.json profile/linkedin
          git commit -m "Update README cards" || exit 0
          git push

      # kozodoi.com reads data.json through jsDelivr, which caches a branch for
      # up to 12 hours; purging makes the day's stats and posts show straight away
      - name: Purge jsDelivr cache
        run: curl -fsS https://purge.jsdelivr.net/gh/kozodoi/kozodoi@master/profile/data.json > /dev/null || true
