name: Update README cards

on:
  schedule:
    # 02:28 UTC daily. Off the hour on purpose: GitHub queues scheduled runs
    # and is busiest at :00, midnight UTC above all, where this used to start
    # around five hours late
    - cron: "28 2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate custom cards
        env:
          # use a PAT (repo + read:user scopes) for private repos and accurate
          # private commit counts; GITHUB_TOKEN works for public-only stats
          GH_TOKEN: ${{ secrets.GH_CARDS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          ORG: "aws-samples"
          INCLUDE_EXTRA: "" # force-add repos, e.g. "aws-samples/foo aws-samples/bar"
          EXCLUDE_REPOS: "" # drop repos, e.g. "aws-samples/tiny-typo-fix"
          LANGS_HIDE: "jupyter notebook,html"
          LANGS_COUNT: "3"
          CARD_WIDTH: "400" # shared with the citations card so both align
          OUT_DIR: "profile"
        run: python scripts/generate_cards.py

      - name: Generate Google Scholar card
        env:
          SCHOLAR_ID: "58tMuD0AAAAJ"
          SCHOLAR_LANG: "en"
          # SerpApi key (repo secret) for a reliable read; scraping is the fallback
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OUT_DIR: "profile"
        run: python scripts/generate_scholar_card.py

      - name: Fetch latest LinkedIn posts
        env:
          # Apify API token (repo secret). A missing, rejected or out-of-credit
          # token fails this step so the run goes red; the last posts are kept
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: "harvestapi~linkedin-profile-posts"
          LINKEDIN_PROFILE: "https://www.linkedin.com/in/kozodoi/"
          LINKEDIN_COUNT: "9"
          OUT_DIR: "profile"
        run: python scripts/fetch_linkedin_posts.py

      - name: Fetch latest X posts
        # runs even when the LinkedIn step failed, and never fails on its own
        # account: X trouble only means no new X posts (see the script)
        if: ${{ !cancelled() }}
        env:
          # the same Apify token; both X scrapers run and their posts are merged
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Claude API key (repo secret) for the Haiku filter that hides posts
          # unrelated to AI and repeats of LinkedIn posts; optional, see the script
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_HANDLE: "n_kozodoi"
          X_COUNT: "20"
          OUT_DIR: "profile"
        run: |
          # without the SDK the filter falls back to word overlap, so an
          # install failure must not stop the step
          pip install --quiet anthropic==2.12.0 || echo "::warning::anthropic SDK not installed"
          python scripts/fetch_x_posts.py

      - name: Commit cards
        # still runs after a failed LinkedIn fetch, so the GitHub and Scholar
        # cards keep updating while the token is fixed; the run stays red
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg profile/data.json profile/linkedin profile/x
          git commit -m "Update README cards" || exit 0
          git push
